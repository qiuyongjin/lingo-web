<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>智能单词点击器 · 单词扩展选择</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(145deg, #f8ede3 0%, #f4e5d8 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          'Segoe UI',
          'Roboto',
          'Noto Sans',
          system-ui,
          -apple-system,
          'Georgia',
          serif;
        margin: 0;
        padding: 1.5rem;
      }

      /* 主卡片 */
      .card {
        max-width: 900px;
        width: 100%;
        background: rgba(255, 255, 245, 0.97);
        backdrop-filter: blur(0px);
        border-radius: 2.5rem;
        box-shadow:
          0 30px 45px -20px rgba(0, 0, 0, 0.3),
          0 1px 2px rgba(0, 0, 0, 0.05);
        padding: 2rem 2rem 2.2rem;
        transition: all 0.2s;
        border: 1px solid rgba(255, 245, 215, 0.8);
      }

      /* 装饰标题区 */
      .title-area {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 1rem;
        border-bottom: 2px dotted #f0cfb0;
        padding-bottom: 0.6rem;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #9b6a3c;
        margin: 0;
        letter-spacing: -0.2px;
        font-family: 'Segoe UI', cursive;
      }
      .badge {
        background: #f7e2ce;
        border-radius: 30px;
        padding: 0.2rem 1rem;
        font-size: 0.7rem;
        color: #a5612a;
        font-weight: 500;
      }

      /* 句子容器区 */
      .sentence-container {
        background: #fffef7;
        border-radius: 1.8rem;
        padding: 1.8rem 2rem;
        margin: 1.2rem 0 1.8rem 0;
        box-shadow:
          inset 0 1px 5px rgba(0, 0, 0, 0.02),
          0 6px 12px -8px rgba(0, 0, 0, 0.1);
        border: 1px solid #ffe6cf;
      }

      /* 原句子段落样式，保留原有可读性 */
      .clickable-sentence {
        font-size: 1.45rem;
        line-height: 1.65;
        font-weight: 450;
        color: #2d2b26;
        margin: 0;
        letter-spacing: 0.01em;
        word-break: break-word;
        font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
      }

      /* 可点击单词的高亮样式 (无过分强调，保持美观) */
      .word-token {
        display: inline-block;
        cursor: pointer;
        border-radius: 0.4rem;
        transition:
          background 0.1s ease,
          transform 0.05s linear;
        padding: 0 0.05rem;
        background-color: rgba(244, 214, 184, 0.2);
        color: #b45f2b;
        font-weight: 520;
      }

      .word-token:active {
        background-color: #ffce9a;
        transform: scale(0.98);
      }

      /* 输出面板: 显示点击单词 + 控制台友好 */
      .feedback-panel {
        background: #fef6ed;
        border-radius: 1.5rem;
        padding: 0.8rem 1.2rem;
        margin-top: 1rem;
        font-family: monospace;
        border-left: 5px solid #f3bc7b;
      }

      .click-log {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        font-size: 0.95rem;
      }

      .log-label {
        background: #e7cfb5;
        padding: 0.2rem 0.8rem;
        border-radius: 2rem;
        font-weight: 600;
        color: #7a4a1f;
      }

      .last-word {
        background: #fff0e2;
        padding: 0.3rem 1rem;
        border-radius: 2rem;
        font-weight: 700;
        color: #bc6f2c;
        word-break: break-all;
        max-width: 280px;
      }

      .info-note {
        font-size: 0.75rem;
        color: #ad8a67;
        margin-top: 0.6rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        border-top: 1px dashed #efdbc8;
        padding-top: 0.6rem;
      }

      button {
        background: none;
        border: none;
        font: inherit;
      }

      .clear-log {
        background: #e7d9cd;
        border: none;
        padding: 0.2rem 1rem;
        border-radius: 2rem;
        font-size: 0.7rem;
        cursor: pointer;
        font-weight: 500;
        transition: 0.1s;
        margin-left: auto;
      }

      .clear-log:hover {
        background: #d8c6b6;
        transform: translateY(-1px);
      }

      hr {
        margin: 0.7rem 0;
        border: 0;
        height: 1px;
        background: linear-gradient(to right, #eedbcb, transparent);
      }

      /* 选中高亮扩展后的效果 (原生浏览器蓝色) 依然可见 */
      ::selection {
        background: #f3bc7b;
        color: #2c2018;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title-area">
        <h2>🐾 波斯猫 · 意趣单词本</h2>
        <div class="badge">✨ 点击单词 ✨ 智能选词扩展</div>
      </div>
      <!-- 原始句子容器: 动态生成单词包裹 -->
      <div class="sentence-container">
        <p class="clickable-sentence" id="magicSentence">
          <!-- 原始静态占位，实际会被JS动态生成结构化内容 -->
        </p>
      </div>
    </div>

    <script>
      ;(function () {
        // ---------- 原始句子 ----------
        const originalText = 'I like a cute cat, especially a Persian cat, which is really adorable and has soft fur.'

        // ---------- 单词拆分策略 ----------
        function tokenizeSentence(text) {
          const regex = /([A-Za-z]+)|([^A-Za-z]+)/g
          const tokens = []
          let match
          while ((match = regex.exec(text)) !== null) {
            if (match[1] !== undefined) {
              tokens.push({ type: 'word', text: match[1] })
            } else if (match[2] !== undefined) {
              tokens.push({ type: 'separator', text: match[2] })
            }
          }
          return tokens
        }

        // 获取句子容器
        const sentenceContainer = document.getElementById('magicSentence')
        sentenceContainer.innerHTML = ''

        const tokens = tokenizeSentence(originalText)
        const wordElementsList = []

        tokens.forEach((token) => {
          if (token.type === 'word') {
            const wordSpan = document.createElement('span')
            wordSpan.className = 'word-token'
            wordSpan.textContent = token.text
            wordSpan.setAttribute('data-word', token.text)
            wordSpan.addEventListener('click', (event) => {
              event.stopPropagation()
              const clickedWord = token.text
              console.log(`[点击单词] ${clickedWord}`)
              updateLastClickedWord(clickedWord)
              wordSpan.style.transform = 'scale(0.97)'
              setTimeout(() => {
                if (wordSpan) wordSpan.style.transform = ''
              }, 120)
            })
            sentenceContainer.appendChild(wordSpan)
            wordElementsList.push(wordSpan)
          } else {
            const separatorNode = document.createTextNode(token.text)
            sentenceContainer.appendChild(separatorNode)
          }
        })

        // UI更新最近点击的单词
        const lastWordSpan = document.getElementById('lastClickedWord')
        function updateLastClickedWord(word) {
          if (lastWordSpan) {
            lastWordSpan.textContent = word
            lastWordSpan.style.opacity = '0.7'
            setTimeout(() => {
              if (lastWordSpan) lastWordSpan.style.opacity = '1'
            }, 150)
          }
        }

        // 清空记录按钮
        const clearBtn = document.getElementById('clearLogBtn')
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            if (lastWordSpan) lastWordSpan.textContent = '—'
            console.log('🗑️ 点击单词记录已清空')
          })
        }

        // ---------- 核心: 单词扩展选择功能 ----------
        function isWordChar(ch) {
          return /[A-Za-z]/.test(ch)
        }

        function getWordBoundaryInTextNode(textNode, offset) {
          if (!textNode || textNode.nodeType !== Node.TEXT_NODE) {
            return { start: offset, end: offset }
          }
          const text = textNode.textContent
          const len = text.length
          let safeOffset = Math.min(Math.max(offset, 0), len)
          let hasWordChar = false
          for (let i = 0; i < len; i++) {
            if (isWordChar(text[i])) {
              hasWordChar = true
              break
            }
          }
          if (!hasWordChar) return { start: safeOffset, end: safeOffset }

          let checkIdx = safeOffset
          if (checkIdx === len && len > 0) checkIdx = len - 1
          if (len === 0) return { start: safeOffset, end: safeOffset }
          const targetChar = text[checkIdx] || ''
          if (!isWordChar(targetChar)) {
            return { start: safeOffset, end: safeOffset }
          }

          let start = safeOffset
          while (start > 0 && isWordChar(text[start - 1])) {
            start--
          }
          let end = safeOffset
          while (end < len && isWordChar(text[end])) {
            end++
          }
          return { start: start, end: end }
        }

        function expandRangeToWordBoundary(range) {
          if (!range) return false
          try {
            let startContainer = range.startContainer
            let startOffset = range.startOffset
            let endContainer = range.endContainer
            let endOffset = range.endOffset

            let newStartOffset = startOffset
            let newStartContainer = startContainer
            if (startContainer.nodeType === Node.TEXT_NODE) {
              const { start: newStart } = getWordBoundaryInTextNode(startContainer, startOffset)
              newStartOffset = newStart
            }

            let newEndOffset = endOffset
            let newEndContainer = endContainer
            if (endContainer.nodeType === Node.TEXT_NODE) {
              const { end: newEnd } = getWordBoundaryInTextNode(endContainer, endOffset)
              newEndOffset = newEnd
            }

            if (
              newStartContainer === startContainer &&
              newStartOffset === startOffset &&
              newEndContainer === endContainer &&
              newEndOffset === endOffset
            ) {
              return false
            }

            const newRange = document.createRange()
            newRange.setStart(newStartContainer, newStartOffset)
            newRange.setEnd(newEndContainer, newEndOffset)
            const sel = window.getSelection()
            if (sel) {
              sel.removeAllRanges()
              sel.addRange(newRange)
            }
            return true
          } catch (e) {
            console.warn('扩展单词边界时出错:', e)
            return false
          }
        }

        // 修复点：同时监听 mouseup 和 touchend，并加入防抖
        let expandTimer = null
        function handleSelectionExpand(event) {
          // 每次触发先清除上一次的定时器，防止触摸事件又触发 mouseup 导致重复执行
          if (expandTimer) clearTimeout(expandTimer)
          expandTimer = setTimeout(() => {
            const selection = window.getSelection()
            if (!selection || selection.isCollapsed) return
            const range = selection.getRangeAt(0)
            if (!range || range.collapsed) return
            expandRangeToWordBoundary(range)
            expandTimer = null
          }, 10) // 10ms 足以让移动端选区稳定
        }

        // 同时监听鼠标和触摸结束事件
        document.addEventListener('mouseup', handleSelectionExpand)
        document.addEventListener('touchend', handleSelectionExpand)

        // 提示信息
        console.log('🍃 句子已初始化，每个单词均为可点击控件。拖拽选中单词局部，松手自动扩展完整单词！')
        console.log(`📖 当前句子共有 ${wordElementsList.length} 个可点击单词。`)

        const sentenceP = document.getElementById('magicSentence')
        if (sentenceP) {
          sentenceP.style.userSelect = 'text'
        }

        const style = document.createElement('style')
        style.textContent = `
            .clickable-sentence {
                word-break: break-word;
            }
            .word-token {
                white-space: normal;
            }
        `
        document.head.appendChild(style)
      })()
    </script>
  </body>
</html>
